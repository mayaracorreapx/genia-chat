<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GenIA</title>
<link rel="icon" type="image/png" href="genia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e7e5e1;
    --text: #140f1f;
    --muted: #6b6870;
    --soft: #8d8a92;
    --navy: #0b2c6b;
    --navy-hover: #0a2358;
    --purple: #7c3aed;
    --bubble-user: #0b2c6b;
    --bubble-user-text: #ffffff;
    --bubble-bot: #ffffff;
    --ok: #16a34a;
    --ok-bg: #e9f8ef;
    --err: #dc2626;
    --err-bg: #fdecec;
    --shadow: 0 1px 2px rgba(20,15,31,.04), 0 8px 24px rgba(20,15,31,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0e13; --surface: #18171e; --border: #2a2832; --text: #f3f1f7;
      --muted: #a9a6b0; --soft: #7d7a85; --navy: #3b6fd8; --navy-hover: #2f5fc4;
      --bubble-user: #2b4f9e; --bubble-bot: #18171e; --ok: #4ade80; --ok-bg: #133022;
      --err: #f87171; --err-bg: #3a1717; --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0e13; --surface: #18171e; --border: #2a2832; --text: #f3f1f7;
    --muted: #a9a6b0; --soft: #7d7a85; --navy: #3b6fd8; --navy-hover: #2f5fc4;
    --bubble-user: #2b4f9e; --bubble-bot: #18171e; --ok: #4ade80; --ok-bg: #133022;
    --err: #f87171; --err-bg: #3a1717; --shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    height: 100dvh; /* acompanha a barra do Safari e o teclado no iPad/iPhone */
    -webkit-text-size-adjust: 100%;
    transition: background .25s, color .25s;
  }
  button { font: inherit; color: inherit; }

  /* Header */
  header {
    height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent;
    display: grid; place-items: center; cursor: pointer; color: var(--text);
  }
  .icon-btn:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }

  /* Avatar */
  .avatar { flex: none; border-radius: 50%; display: block; }

  /* Main */
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }

  .hero {
    display: flex; gap: 22px; padding-top: 18vh; padding-bottom: 36px;
    transition: padding .5s ease;
  }
  .hero-bar { width: 3px; border-radius: 3px; flex: none; background: linear-gradient(#5b8def, #8b3df0 45%, #f0803d); }
  .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .28em;
    color: var(--muted); display: flex; align-items: center; gap: 10px; margin: 4px 0 14px;
  }
  .eyebrow::before { content: ""; width: 16px; height: 1px; background: var(--soft); }
  .hero h1 { font-size: clamp(36px, 6vw, 58px); line-height: 1.05; letter-spacing: -.035em; margin: 0 0 16px; font-weight: 700; }
  .hero h1 em { font-weight: 600; color: color-mix(in srgb, var(--text) 75%, var(--bg)); }
  .hero p { font-size: clamp(16px, 2.2vw, 19px); line-height: 1.55; color: var(--muted); margin: 0; max-width: 560px; }

  body.chatting .hero { padding-top: 32px; padding-bottom: 20px; }

  /* Chat */
  .thread { display: flex; flex-direction: column; gap: 18px; padding-bottom: 24px; }
  .msg { display: flex; gap: 12px; align-items: flex-end; animation: rise .35s ease both; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: min(560px, 82%); padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 15.5px;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .bot .bubble { background: var(--bubble-bot); border: 1px solid var(--border); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .user .bubble { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 6px; }
  .user-col { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 82%; }
  .user-col .bubble { max-width: 100%; }

  .status {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500;
    padding: 4px 10px 4px 6px; border-radius: 999px; color: var(--muted);
  }
  .status.saving .spin {
    width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--navy);
    animation: spin .8s linear infinite;
  }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.ok .check { width: 16px; height: 16px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; animation: pop .35s cubic-bezier(.3,1.6,.6,1) both; }
  .status.ok .check svg path { stroke-dasharray: 14; stroke-dashoffset: 14; animation: draw .35s .15s ease forwards; }
  .status.err { background: var(--err-bg); color: var(--err); }
  .status.err button { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font-weight: 600; }

  .typing { display: inline-flex; gap: 4px; padding: 16px 18px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--soft); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }

  .done-card {
    margin-top: 10px; border-radius: 14px; padding: 14px 16px; background: var(--ok-bg);
    display: flex; gap: 12px; align-items: flex-start; color: var(--text); white-space: normal;
  }
  .done-card .big { width: 28px; height: 28px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; flex: none; animation: pop .45s cubic-bezier(.3,1.6,.6,1) both; }
  .done-card ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
  .done-card li { display: flex; gap: 6px; align-items: center; }
  .done-card li::before { content: "✓"; color: var(--ok); font-weight: 700; }
  .restart { margin-top: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .restart:hover { border-color: var(--soft); }

  /* Composer */
  .composer-zone { flex: none; padding: 12px 0 max(20px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
  .composer {
    background: var(--surface); border: 1px solid var(--border); border-radius: 26px; box-shadow: var(--shadow);
    padding: 16px 12px 10px 20px; transition: border-color .2s, box-shadow .2s;
  }
  .composer:focus-within { border-color: color-mix(in srgb, var(--navy) 40%, var(--border)); }
  .composer.invalid { border-color: var(--err); animation: shake .35s; }
  .composer textarea {
    width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.5; max-height: 160px; padding: 0;
  }
  .composer textarea::placeholder { color: var(--soft); }
  .composer textarea:disabled { opacity: .6; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .steps { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); min-width: 0; }
  .step { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .step .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
  .step.active { color: var(--purple); font-weight: 500; }
  .step.active .dot { border-color: var(--purple); }
  .step.done { color: var(--ok); }
  .step.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
  .sep { width: 1px; height: 18px; background: var(--border); }
  .hint { font-size: 12px; color: var(--soft); }
  .send {
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--navy); color: #fff;
    display: grid; place-items: center; cursor: pointer; flex: none; transition: background .2s, transform .1s, opacity .2s;
  }
  .send:hover { background: var(--navy-hover); }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .35; cursor: default; }
  .foot { display: flex; justify-content: space-between; padding: 10px 6px 0; font-size: 12.5px; color: var(--soft); }
  .demo { color: #b45309; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes pop { from { transform: scale(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  @media (max-width: 600px) {
    .hero { padding-top: 8vh; gap: 16px; }
    .hint, .step-label-long { display: none; }
    .bubble { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="avatar" src="genia.png" width="40" height="40" alt="GenIA">
    <span>GenIA</span>
  </div>
  <button class="icon-btn" id="theme" aria-label="Alternar tema">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main id="scroller">
  <div class="wrap">
    <section class="hero">
      <div class="hero-bar"></div>
      <div>
        <div class="eyebrow">LURIA ONE</div>
        <h1 id="greet">Olá, eu sou a <em>GenIA.</em></h1>
        <p>Me conta o que você quer saber. Eu registro sua pergunta e envio a resposta direto no seu e-mail.</p>
      </div>
    </section>
    <div class="thread" id="thread" aria-live="polite"></div>
  </div>
</main>

<div class="composer-zone">
  <div class="wrap">
    <form class="composer" id="composer" autocomplete="on">
      <textarea id="input" rows="1" placeholder="Seu e-mail" aria-label="Sua resposta"></textarea>
      <div class="bar">
        <div class="steps">
          <span class="step active" id="s1"><span class="dot">1</span>E-mail</span>
          <span class="sep"></span>
          <span class="step" id="s2"><span class="dot">2</span>Pergunta</span>
          <span class="hint" id="hint">Enter para enviar</span>
        </div>
        <button class="send" id="send" type="submit" aria-label="Enviar" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
    <div class="foot"><span>Suas respostas ficam registradas com segurança.</span><span class="demo" id="demo"></span></div>
  </div>
</div>

<script>
  // Cole aqui a URL do App da Web (termina em /exec). Vazio = modo demonstração.
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxGVW3_DiMwIaXxbmyg-eF6CIOq76T3uwMoGvjNLl0lPNgE_E2mFK-Cxylen2DJGiNcBA/exec';

  const $ = (id) => document.getElementById(id);
  const thread = $('thread'), input = $('input'), send = $('send'), composer = $('composer'), scroller = $('scroller');
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const AVATAR = '<img class="avatar" src="genia.png" width="34" height="34" alt="">';
  const CHECK = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';

  let step = 0;          // 0 = e-mail, 1 = pergunta, 2 = concluído
  let busy = false;
  let state = { id: null, email: '', pergunta: '' };

  if (!SCRIPT_URL) $('demo').textContent = 'Modo demonstração: nada é gravado';

  // Tema
  $('theme').onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  };

  // Saudação conforme o horário
  // Sempre no horário de Brasília, independente do fuso do aparelho
  function saudacao() {
    const h = Number(new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: 'numeric', hourCycle: 'h23' }).format(new Date()));
    return h >= 5 && h < 12 ? 'Bom dia' : h >= 12 && h < 18 ? 'Boa tarde' : 'Boa noite';
  }
  function atualizarSaudacao() { $('greet').innerHTML = `${saudacao()}, eu sou a <em>GenIA.</em>`; }
  atualizarSaudacao();
  setInterval(atualizarSaudacao, 60000);

  function scrollDown() { requestAnimationFrame(() => scroller.scrollTop = scroller.scrollHeight); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  async function botSay(html, typingMs = 900) {
    const row = document.createElement('div');
    row.className = 'msg bot';
    row.innerHTML = `${AVATAR}<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
    const bubble = row.querySelector('.bubble');
    bubble.style.padding = '0';
    thread.appendChild(row); scrollDown();
    await wait(typingMs);
    bubble.style.padding = '';
    bubble.innerHTML = html;
    scrollDown();
    return bubble;
  }

  function userSay(text) {
    const row = document.createElement('div');
    row.className = 'msg user';
    row.innerHTML = `<div class="user-col"><div class="bubble">${esc(text)}</div><span class="status saving"><span class="spin"></span>Salvando…</span></div>`;
    thread.appendChild(row); scrollDown();
    return row.querySelector('.status');
  }

  function setStatus(el, kind, label, retry) {
    el.className = 'status ' + kind;
    if (kind === 'ok') el.innerHTML = `<span class="check">${CHECK}</span>${label}`;
    else if (kind === 'err') { el.innerHTML = `${label} · <button type="button">Tentar de novo</button>`; el.querySelector('button').onclick = retry; }
    else el.innerHTML = `<span class="spin"></span>${label}`;
    scrollDown();
  }

  function setStep(n) {
    step = n;
    $('s1').className = 'step ' + (n === 0 ? 'active' : 'done');
    $('s2').className = 'step ' + (n === 1 ? 'active' : n > 1 ? 'done' : '');
    $('s1').querySelector('.dot').innerHTML = n > 0 ? '✓' : '1';
    $('s2').querySelector('.dot').innerHTML = n > 1 ? '✓' : '2';
    input.placeholder = n === 0 ? 'Seu e-mail' : n === 1 ? 'Escreva sua pergunta para a GenIA' : 'Tudo certo por aqui ✨';
    input.inputMode = n === 0 ? 'email' : 'text';
    input.autocomplete = n === 0 ? 'email' : 'off';
    $('hint').textContent = n === 1 ? 'Shift + Enter para quebrar linha' : 'Enter para enviar';
  }

  async function post(payload) {
    if (!SCRIPT_URL) { await wait(700 + Math.random() * 500); return { ok: true, id: 'demo-' + Date.now() }; }
    // text/plain evita o preflight de CORS do Apps Script
    const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Falha ao salvar');
    return data;
  }

  function lock(on) {
    busy = on;
    input.disabled = on || step > 1;
    send.disabled = on || !input.value.trim();
    if (!on && step <= 1) input.focus();
  }

  function invalid() {
    composer.classList.remove('invalid'); void composer.offsetWidth; composer.classList.add('invalid');
  }

  async function saveEmail(statusEl) {
    lock(true);
    setStatus(statusEl, 'saving', 'Salvando…');
    try {
      const r = await post({ action: 'start', email: state.email });
      state.id = r.id;
      setStatus(statusEl, 'ok', 'E-mail armazenado');
      setStep(1);
      await botSay('Perfeito, anotei seu e-mail! 📬\n\n<strong>O que você gostaria que a GenIA te respondesse?</strong>');
      lock(false);
    } catch (e) {
      setStatus(statusEl, 'err', 'Não consegui salvar', () => saveEmail(statusEl));
      busy = false;
    }
  }

  async function saveQuestion(statusEl) {
    lock(true);
    setStatus(statusEl, 'saving', 'Salvando…');
    try {
      await post({ action: 'answer', id: state.id, pergunta: state.pergunta });
      setStatus(statusEl, 'ok', 'Pergunta armazenada');
      setStep(2);
      lock(true);
      await botSay(
        `Prontinho! Recebi todas as suas respostas. 🎉
<div class="done-card"><span class="big"><svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></span><div><strong>Tudo registrado</strong><ul><li>E-mail: ${esc(state.email)}</li><li>Pergunta recebida</li></ul></div></div>
A resposta da sua pergunta vai chegar no e-mail <strong>${esc(state.email)}</strong>. Fica de olho na caixa de entrada (e no spam, só por garantia 😉).
<button class="restart" type="button" id="restart">Fazer outra pergunta</button>`, 1200);
      $('restart').onclick = restart;
    } catch (e) {
      setStatus(statusEl, 'err', 'Não consegui salvar', () => saveQuestion(statusEl));
      busy = false;
    }
  }

  async function restart() {
    thread.innerHTML = '';
    state = { id: null, email: '', pergunta: '' };
    document.body.classList.remove('chatting');
    setStep(0); input.value = ''; lock(true);
    await start();
  }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    if (busy || step > 1) return;
    const text = input.value.trim();
    if (!text) return;

    if (step === 0) {
      if (!EMAIL_RE.test(text)) {
        invalid();
        botSay('Hmm, esse e-mail não parece válido. Pode conferir? Algo como <strong>nome@empresa.com</strong>.', 500);
        return;
      }
      state.email = text;
    } else {
      state.pergunta = text;
    }
    input.value = ''; autosize();
    document.body.classList.add('chatting');
    const statusEl = userSay(text);
    step === 0 ? saveEmail(statusEl) : saveQuestion(statusEl);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); composer.requestSubmit(); }
  });
  function autosize() { composer.classList.remove('invalid'); input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; send.disabled = busy || !input.value.trim(); }
  input.addEventListener('input', autosize);

  async function start() {
    lock(true);
    await wait(500);
    await botSay('Oi! Que bom ter você por aqui. 👋\n\nPra começar, <strong>qual é o seu e-mail?</strong> É por ele que vou te mandar a resposta.', 1000);
    lock(false);
  }
  start();
</script>
</body>
</html>
